name: ci

on:
    push:
        branches: [master]
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    typecheck:
        name: Apex type check
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: lts/*

            # Pinned on purpose. The plugin was last published in June 2022, so a floating version
            # is not going to bring improvements but could change behavior without warning. The
            # piped "y" answers its third-party plugin prompt, which has no flag to skip.
            - name: Install Salesforce CLI and apexlink
              run: |
                  npm install --global @salesforce/cli
                  echo y | sf plugins install apexlink@2.3.5

            # apexlink resolves every type and member reference offline, with no org and no
            # credentials. This is the job that catches a compile error. Code Analyzer cannot:
            # PMD parses Apex without type checking it, so a broken expression reads as an
            # ordinary property access and passes straight through.
            #
            # apexlink exits 0 whatever it finds, so the message count is the gate.
            #
            # It knows the platform types as of mid 2022, which means System.Assert and
            # System.AccessLevel are reported as unknown even though both compile. The Apex here
            # deliberately avoids them. If you reach for a platform type newer than that, expect a
            # false error from this job and read the README before working around it.
            - name: Type check Apex
              run: |
                  sf apexlink check --json > apexlink-results.json
                  count=$(jq '[.result.files[]?.messages[]?] | length' apexlink-results.json)
                  jq -r --arg root "${GITHUB_WORKSPACE}/" '
                    .result.files[]?
                    | (.path | sub("^" + $root; "")) as $file
                    | .messages[]?
                    | "::error file=\($file),line=\(.start.line)::\(.category): \(.message)"
                  ' apexlink-results.json
                  if [ "${count}" -gt 0 ]; then
                    echo "apexlink found ${count} unresolved reference(s)."
                    exit 1
                  fi
                  echo "apexlink: no unresolved references."

            - name: Upload results
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: apexlink-results
                  path: apexlink-results.json

    analyze:
        name: Code Analyzer
        runs-on: ubuntu-latest
        permissions:
            contents: read
            security-events: write
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: lts/*

            - name: Install Salesforce CLI and Code Analyzer
              run: |
                  npm install --global @salesforce/cli
                  sf plugins install code-analyzer

            # Fails on a Critical or High finding. Moderate and below are reported but do not
            # block. This job covers style, security patterns, and stale API versions. It does not
            # and cannot cover whether the code compiles: that is the typecheck job.
            - name: Run Code Analyzer
              run: |
                  sf code-analyzer run \
                    --workspace force-app \
                    --rule-selector Recommended \
                    --severity-threshold 2 \
                    --output-file code-analyzer-results.html \
                    --output-file code-analyzer-results.json \
                    --output-file code-analyzer-results.sarif

            - name: Upload results
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: code-analyzer-results
                  path: code-analyzer-results.*

            # Free on a public repository. Harmless if code scanning is switched off.
            - name: Send findings to code scanning
              if: always()
              continue-on-error: true
              uses: github/codeql-action/upload-sarif@v3
              with:
                  sarif_file: code-analyzer-results.sarif
